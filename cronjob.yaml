---
# reseed-mover CronJob
# Runs every 6 hours to repoint completed torrents to their *arr library paths.
#
# Prerequisites:
#   kubectl create secret generic arr-api-keys \
#     --from-literal=RADARR_API_KEY=your-radarr-key \
#     --from-literal=SONARR_API_KEY=your-sonarr-key
#
# The pod needs read-write access to /downloads (cleanup() deletes the old
# copy there) and read-only access to /media (verify files before repointing).

apiVersion: batch/v1
kind: CronJob
metadata:
  name: reseed-mover
  namespace: torrent
  labels:
    app.kubernetes.io/name: reseed-mover
    app.kubernetes.io/part-of: arr-stack
spec:
  schedule: "0 */6 * * *" # every 6h — tune to taste
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retries: exit 1 just means a torrent was reverted or left
      # pending, and the next scheduled run resolves those anyway. A retry
      # pod only ran into activeDeadlineSeconds and got killed mid-repoint.
      backoffLimit: 0
      # Rehashing 2160p files takes minutes each. RUN_BUDGET (default 2400s)
      # stops starting new repoints with HASH_TIMEOUT (default 600s) to spare;
      # a kill mid-repoint is still safe — the next run resolves it.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: github-container-registry
          containers:
            - name: reseed-mover
              image: ghcr.io/korni22/reseed-mover:main
              imagePullPolicy: Always
              env:
                - name: RTORRENT_XMLRPC_URL
                  # Direct SCGI port, not ruTorrent's httprpc: its XMLRPCProxy
                  # sends d.directory.set/d.close/d.check_hash/d.erase untrusted
                  # and rtorrent >= 0.16.9 rejects them (Fault -507).
                  value: "http://rtorrent-1.torrent.svc.cluster.local:8000/RPC2"
                - name: RADARR_URL
                  value: "http://radarr.radarr.svc.cluster.local:7878"
                - name: SONARR_URL
                  value: "http://sonarr.sonarr.svc.cluster.local:8989"
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: RADARR_API_KEY
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-api-keys
                      key: SONARR_API_KEY
                - name: DOWNLOADS_BASE
                  value: "/downloads/complete"
                - name: DRY_RUN
                  value: "false"
                - name: CLEANUP_OLD
                  value: "true"
                - name: VERIFY_FILES
                  value: "true"
                # Only gates erasing flattened multi-file torrents (they
                # stop seeding for good); repoints never wait.
                - name: MIN_SEED_HOURS
                  value: "140"
              volumeMounts:
                - name: downloads
                  mountPath: /downloads
                  readOnly: false
                - name: media
                  mountPath: /media
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: downloads
              hostPath:
                path: /mnt/downloads_1
            - name: media
              hostPath:
                path: /mnt/media
